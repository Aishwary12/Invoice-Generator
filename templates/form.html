<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Invoice Generator</title>
<style>
body{font-family:Arial; padding:30px;}
input,select{padding:6px;margin:4px;width:260px;}
button{padding:10px 18px;margin-top:15px;}
</style>
</head>
<body>

<h2>Hotel Details</h2>
<form method="post">

<input name="hotel_name" placeholder="Hotel Name" required><br>
<input name="hotel_address" placeholder="Hotel Address" required><br>
<input name="hotel_phone" placeholder="Phone"><br>
<input name="hotel_res_phone" placeholder="Res Phone"><br>
<input name="hotel_gstin" placeholder="GSTIN"><br>

<h2>Booking Details</h2>

<input name="folio_no" placeholder="Folio No"><br>
<input name="bill_no" placeholder="Bill No"><br>
<input name="room_no" placeholder="Room No"><br>

<select name="room_type">
<option>DELUXE</option>
<option>AC ROOM</option>
</select><br>

<input name="guest_name" placeholder="Guest Name"><br>
<input name="guest_address" placeholder="Address"><br>
<input name="pax" placeholder="Pax"><br>
<input name="food_plan" placeholder="Food Plan"><br>
<input name="company" placeholder="Company"><br>

<label>Check In</label><br>
<input type="datetime-local" name="checkin" required><br>

<label>Check Out</label><br>
<input type="datetime-local" name="checkout" required><br>

<input name="tariff" placeholder="Room Tarff per Night" required><br>

<h2>Payments</h2>

<div id="payments">
<div>
<input type="date" name="pay_date[]" required>
<select name="pay_method[]">
<option>PHONE PAY()</option>
<option>GPAY()</option>
<option>CASH</option>
</select>
<input name="pay_amount[]" placeholder="Amount">
</div>
</div>

<button type="button" onclick="addPayment()">Add Payment</button>
<br><br>

<button type="submit">Generate Invoice</button>

</form>

<script>
function addPayment(){
    let div=document.createElement("div");
    div.innerHTML=`
    <input type="date" name="pay_date[]" required>
    <select name="pay_method[]">
        <option>PHONE PAY()</option>
        <option>GPAY()</option>
        <option>CASH</option>
    </select>
    <input name="pay_amount[]" placeholder="Amount">
    `;
    document.getElementById("payments").appendChild(div);
}
</script>

</body>
</html>
